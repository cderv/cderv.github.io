<!doctype html>
<!--
  Default link preview image (og:image) for cderv.dev, 1200 x 630.

  Why this exists: q2 does not support Open Graph yet, so
  _scripts/opengraph.js writes the tags and points pages without their own
  `image:` to images/social-card.png. Quarto 1 does not generate such a card
  either: with `open-graph: true` it uses the page `image`, else an image found in the page.

  Regenerate images/social-card.png after editing:
    node _social-card/make-card.js
  (needs Playwright: npm i -g playwright && npx playwright install chromium)
  The portrait is the site's images/christophe.jpg.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box;
    background: #fbfaf7; color: #2b3640;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; gap: 64px; padding: 0 88px;
    border-bottom: 18px solid #1f2a33;
  }
  .text { flex: 1; }
  .brand {
    display: inline-block; background: #0f6b78; color: #fefefe;
    font-size: 30px; font-weight: 600; letter-spacing: 0.04em;
    padding: 10px 20px 12px; text-transform: uppercase;
  }
  h1 {
    font-size: 54px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em;
    margin: 40px 0 0; padding-bottom: 32px; border-bottom: 6px solid #1f2a33;
  }
  .url { margin-top: 28px; font-size: 30px; color: #0f6b78; font-weight: 600; }
  .photo {
    width: 300px; height: 300px; border-radius: 50%; object-fit: cover;
    border: 6px solid #0f6b78; flex: none;
  }
</style>
</head>
<body>
  <div class="text">
    <div class="brand">Christophe Dervieux</div>
    <h1>Quarto team at Posit. R&nbsp;Markdown maintainer. Coding with AI agents, on Windows.</h1>
    <div class="url">cderv.dev</div>
  </div>
  <img class="photo" src="../images/christophe.jpg" alt="" onerror="this.remove()">
</body>
</html>
