name: Publish site

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

# Production deploys queue one after the other; a new push to a PR
# cancels the previous preview build of that PR.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('preview-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Nightly q2 from the GitHub releases of quarto-dev/q2, checked with
      # minisign by the installer. For a fixed release, replace --nightly
      # with --version vX.Y.Z.
      - name: Install q2 (nightly)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get install -y minisign
          curl -fsSL https://raw.githubusercontent.com/quarto-dev/q2/main/install.sh | bash -s -- --nightly
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: q2 version
        run: q2 --version

      - name: Render
        run: q2 render

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: site-preview
          path: _site
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Preview of the rendered site for each PR, as a Cloudflare Workers
  # Preview of the assets-only Worker defined in wrangler.jsonc:
  # https://pr-<N>-cderv-dev-preview.<subdomain>.workers.dev (noindex).
  # Skipped when the secrets are absent, e.g. for PRs from forks.
  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets not set, no preview deployed. The rendered site is in the site-preview artifact."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          name: site-preview
          path: _site

      - name: Create or update the Cloudflare preview
        id: preview
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -o pipefail
          output="$(npx --yes wrangler@4 preview --name "$PREVIEW_NAME" --message "${{ github.event.pull_request.head.sha }}" --json)"
          printf '%s\n' "$output"
          preview_url="$(printf '%s' "$output" | jq -er '.preview.urls[0]')"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Comment the preview link on the PR
        if: steps.check.outputs.enabled == 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = '<!-- site-preview -->';
            const url = process.env.PREVIEW_URL;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\nPreview of the site: ${url}\n\nBuilt from ${sha}. This link stays the same for the whole PR.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # Delete the PR's preview once the PR is closed or merged.
  preview-cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Delete the Cloudflare preview
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation
