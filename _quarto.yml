project:
  type: website

website:
  title: "Christophe Dervieux"
  description: "Notes on Quarto, R Markdown, and working with AI agents."
  site-url: https://example.invalid # TODO: set when the domain is chosen (needed for RSS)
  navbar:
    left:
      - text: Blog
        href: index.qmd
      - text: Talks
        href: talks.qmd
      - text: About
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/cderv
      - icon: rss
        href: index.xml
  page-footer:
    center: |
      [[Christophe Dervieux](/index.html){.gw-footer-title} [↑](#){.gw-top aria-label="Back to top"}]{.gw-footer-brand}
      [© 2026 Christophe Dervieux / Built with [Quarto](https://quarto.org)]{.gw-footer-line}
      [Look inspired by the [Ghostwriter theme](https://github.com/roryg/ghostwriter) by JollyGoodThemes]{.gw-footer-line}

format:
  html:
    theme:
      light: [default, theme/ghostwriter.scss]
      dark: [default, theme/ghostwriter.scss, theme/ghostwriter-dark.scss]
    respect-user-color-scheme: true
    syntax-highlighting: github
    date-format: "ddd, MMM D, YYYY"
