project:
  type: ghostwriter
  resources:
    # Decks and redirect pages moved from cderv/presentations (old GitHub Pages site).
    - presentations/

website:
  title: "Christophe Dervieux"
  description: "Notes on Quarto, R Markdown, and working with AI agents."
  site-url: https://cderv.dev
  # Link preview image for pages without their own image (Open Graph and
  # Twitter card tags are turned on by the Ghostwriter extension).
  image: images/social-card.png
  image-alt: Christophe Dervieux
  navbar:
    left:
      - text: Blog
        href: index.qmd
      - text: Talks
        href: talks.qmd
      - text: Projects
        href: projects.qmd
      - text: About
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/cderv
      - icon: rss
        href: index.xml
  page-footer:
    center: |
      [[Christophe Dervieux](/index.html){.gw-footer-title} [↑](#){.gw-top aria-label="Back to top"}]{.gw-footer-brand}
      [© 2026 Christophe Dervieux / Built with [Quarto](https://quarto.org)]{.gw-footer-line}
      [Layout inspired by the [Ghostwriter theme](https://github.com/roryg/ghostwriter) by JollyGoodThemes]{.gw-footer-line}

format:
  html:
    # Added after the extension's theme files (lists combine).
    theme:
      light: [styles/site.scss]
      dark: [styles/site.scss]
